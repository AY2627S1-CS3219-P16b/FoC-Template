services:
  supplier-db:
    image: postgres:17
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: supplier
      POSTGRES_PASSWORD: supplier_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - supplier-db-data:/var/lib/postgresql/data

volumes:
  supplier-db-data: